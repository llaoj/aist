name: Feature request / 功能建议
description: Suggest an idea or improvement. / 提出新功能或改进建议。
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / 要解决的问题
      description: What operations scenario or pain point is this about? / 遇到了什么运维场景或痛点？
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution / 期望的方案
      description: How would you like it to work? / 希望它怎样工作？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered / 考虑过的替代方案
  - type: dropdown
    id: component
    attributes:
      label: Component / 组件
      options:
        - Client (aist)
        - Server
        - Both / 两者
        - Not sure / 不确定
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution / 贡献意愿
      options:
        - label: I'm willing to submit a pull request for this. / 我愿意为此提交 PR。
