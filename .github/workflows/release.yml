name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./...

      - name: Resolve version
        id: version
        run: |
          version="${GITHUB_REF_NAME}"
          image_tag="${version#v}"
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          prerelease="false"
          if [[ "$version" == *-* ]]; then
            prerelease="true"
          fi
          deploy_fly="false"
          if [[ -n "${FLY_API_TOKEN:-}" ]]; then
            deploy_fly="true"
          fi

          {
            echo "version=${version}"
            echo "image_tag=${image_tag}"
            echo "commit=${GITHUB_SHA::7}"
            echo "build_date=$(date -u +%F)"
            echo "prerelease=${prerelease}"
            echo "deploy_fly=${deploy_fly}"
            echo "image_tags<<EOF"
            echo "ghcr.io/${owner}/aist-server:${image_tag}"
            echo "ghcr.io/${owner}/aist-server:${version}"
            if [[ "$prerelease" == "false" ]]; then
              echo "ghcr.io/${owner}/aist-server:latest"
            fi
            if [[ "$deploy_fly" == "true" ]]; then
              echo "registry.fly.io/aist-server:${image_tag}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Build client release archives
        run: |
          ./scripts/build-client.sh
          rm -rf dist/release
          mkdir -p dist/release
          cp "dist/client/${VERSION}"/*.tar.gz dist/release/
          (cd dist/release && sha256sum *.tar.gz > checksums.txt)
        env:
          GOPROXY: https://proxy.golang.org,direct
          VERSION: ${{ steps.version.outputs.version }}
          COMMIT: ${{ steps.version.outputs.commit }}
          BUILD_DATE: ${{ steps.version.outputs.build_date }}

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Authenticate to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - if: steps.version.outputs.deploy_fly == 'true'
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Authenticate to Fly registry
        if: steps.version.outputs.deploy_fly == 'true'
        run: flyctl auth docker
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # The image builds the client and the server from the same commit and
      # version, and bundles the client for distribution.
      - name: Build and push server image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.version.outputs.image_tags }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            COMMIT=${{ steps.version.outputs.commit }}
            BUILD_DATE=${{ steps.version.outputs.build_date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Fly.io
        if: steps.version.outputs.deploy_fly == 'true'
        run: |
          flyctl deploy \
            --config deploy/server/fly.toml \
            --image registry.fly.io/aist-server:${{ steps.version.outputs.image_tag }} \
            --app aist-server \
            --now
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Publish GitHub Release
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" dist/release/* --clobber
          else
            release_args=(--title "$VERSION" --generate-notes)
            if [[ "$PRERELEASE" == "true" ]]; then
              release_args+=(--prerelease)
            fi
            gh release create "$VERSION" dist/release/* "${release_args[@]}"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
