name: cla

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/v1/cla.json
          path-to-document: https://github.com/llaoj/aist/blob/main/CLA.md
          branch: cla-signatures
          allowlist: llaoj,dependabot[bot],github-actions[bot]
          custom-notsigned-prcomment: |
            Thanks for your contribution! Before we can merge it, please read the [Contributor License Agreement](https://github.com/llaoj/aist/blob/main/CLA.md) and sign it by replying to this pull request with the comment below. You only need to sign once.

            感谢你的贡献！合并前请阅读[贡献者许可协议](https://github.com/llaoj/aist/blob/main/CLA.md)，并在本 PR 中回复下面这句话完成签署，只需签署一次。
          custom-allsigned-prcomment: All contributors have signed the CLA. ✅ / 所有贡献者均已签署 CLA。
          lock-pullrequest-aftermerge: false
